version: '3.8'

services:
  nginx:
    image: nginx:1.24-alpine
    container_name: smart-resume-ai-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - ./nginx/html:/var/www/html:ro
    networks:
      - smart-resume-ai-net
    depends_on:
      - smart-resume-ai-api
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  smart-resume-ai-api:
    build:                       # собираем локально
      context: .
      dockerfile: Dockerfile.prod
    container_name: smart-resume-ai-api
    env_file:
      - .env.local
    environment:
      NODE_ENV: production
      PORT: 3000
      API_PREFIX: /api/v1
      CORS_ORIGIN: https://smartresume-ai.com
      CORS_CREDENTIALS: true
    networks:
      - smart-resume-ai-net
    depends_on:
      - smart-resume-ai-pg       # ждём Postgres
    restart: unless-stopped

  smart-resume-ai-pg:
    image: postgres:15
    container_name: smart-resume-ai-pg
    env_file:
      - .env.local
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres}" ]
      interval: 2s
      timeout: 5s
      retries: 10
    networks:
      - smart-resume-ai-net
    restart: unless-stopped
    command: postgres -c 'max_connections=200'

volumes:
  postgres-data:

networks:
  smart-resume-ai-net:
    driver: bridge
